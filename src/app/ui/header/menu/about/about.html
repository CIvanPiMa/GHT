<div class="menu-container about">
  <div class="line">
    <p [ght-label]="'about.ip'" [ght-label-args]="['<a href=\'https:\/\/cephalofair.com\' target=\'_blank\'>Cephalofair Games</a>']"></p>
  </div>
  <div class="line version">
      <a class="disabled">GH-Tracker v{{ version }}</a>

    <div class="version-info">
      <a class="force" (click)="forceUpdate()"><span [ght-label]="'about.forceUpdate'"></span></a>
    </div>
  </div>

  <div class="line">
    <div class="columns">
      <div class="column">
        <p>
          <a href="https://github.com/CIvanPiMa/gh-tracker" target="_blank"
            ><span [ght-label]="'about.sourceCode.author'"></span
          ></a>
        </p>
      </div>
      <div class="column">
        <p
          [ght-label]="'about.license'"
          [ght-label-args]="[
            'AGPL3'
          ]"
        ></p>
      </div>
    </div>
  </div>
</div>

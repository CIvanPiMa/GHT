services:
  app:
    container_name: ght
    image: ght:local
    build:
      context: https://github.com/CIvanPiMa/GHT.git
      dockerfile: Dockerfile
    ports:
      - "8081:80"

  server:
    container_name: ght-server
    image: ght-server:local
    build:
      context: https://github.com/CIvanPiMa/GHT-server.git
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    volumes:
      - ght-server-data:/data
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      PUBLIC: "true"
    restart: unless-stopped

volumes:
  ght-server-data:
    driver: local
